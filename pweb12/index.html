<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemrograman Web XII</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --hover-bg: rgba(255, 255, 255, 0.04);
            --file-color: #10b981;
            --folder-color: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-color) 0%, #1e1b4b 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            animation: fadeIn 0.5s ease-out;
        }

        header {
            padding: 2rem 1.5rem;
            border-bottom: 1px solid var(--card-border);
            background: rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .path {
            margin-top: 0.5rem;
            color: var(--text-muted);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .path a {
            color: var(--accent);
            text-decoration: none;
        }
        .path a:hover {
            text-decoration: underline;
        }

        .list-header {
            display: flex;
            padding: 0.75rem 1.5rem;
            border-bottom: 1px solid var(--card-border);
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: rgba(0,0,0,0.1);
        }

        .col-name { flex: 2; display: flex; align-items: center; gap: 1rem; }
        .col-date { flex: 1; color: var(--text-muted); }
        .col-size { flex: 0.5; text-align: right; color: var(--text-muted); }

        .list-row {
            display: flex;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-decoration: none;
            color: var(--text-main);
            align-items: center;
            transition: background 0.2s;
        }

        .list-row:last-child {
            border-bottom: none;
        }

        .list-row:hover {
            background: var(--hover-bg);
        }

        .list-row .col-name {
            font-weight: 500;
            color: var(--accent);
        }

        .list-row:hover .col-name {
            text-decoration: underline;
        }

        .icon {
            width: 24px;
            height: 24px;
            color: var(--file-color);
            flex-shrink: 0;
        }
        .icon.folder {
            color: var(--folder-color);
        }
        .icon.link {
            color: var(--accent);
        }

        footer {
            margin-top: 2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            .col-date { display: none; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Pemrograman Web XII</h1>
            <div class="path"><a href="../index.html">Index of /</a> / pweb12 /</div>
        </header>

        <div class="list-header">
            <div class="col-name">Name</div>
            <div class="col-date">Last modified</div>
            <div class="col-size">Size</div>
        </div>

        <div class="file-list">
            <!-- Parent Directory Link -->
            <a href="../index.html" class="list-row">
                <div class="col-name">
                    <svg class="icon folder" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l-5.5 9h11z" transform="rotate(-90 12 12)"></path></svg>
                    Parent Directory
                </div>
                <div class="col-date">-</div>
                <div class="col-size">-</div>
            </a>

            <!-- Sample File 1 -->
            <a href="#" class="list-row">
                <div class="col-name">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
                    Tugas_1_PHP.html
                </div>
                <div class="col-date">24-Jul-2026 10:15</div>
                <div class="col-size">15 KB</div>
            </a>

            <!-- Sample Link -->
            <a href="https://php.net" target="_blank" class="list-row">
                <div class="col-name">
                    <svg class="icon link" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                    Dokumentasi PHP (External)
                </div>
                <div class="col-date">26-Jul-2026 11:20</div>
                <div class="col-size">-</div>
            </a>
        </div>
    </div>

</body>
</html>
