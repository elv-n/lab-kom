<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Index of /</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet" />
    <style>
      :root {
        --bg-color: #ffffff;
        --card-bg: #ffffff;
        --card-border: #ebebeb;
        --text-main: #171717;
        --text-muted: #666666;
        --accent: #171717;
        --link-color: #0072f5;
        --hover-bg: #fafafa;
        --file-color: #666666;
        --folder-color: #171717;
        --shadow-default: rgba(0, 0, 0, 0.08) 0px 0px 0px 1px, rgba(0, 0, 0, 0.04) 0px 2px 2px 0px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #0a0a0a;
          --card-bg: #0a0a0a;
          --card-border: #2a2a2a;
          --text-main: #ededed;
          --text-muted: #808080;
          --accent: #ededed;
          --link-color: #0072f5;
          --hover-bg: #111111;
          --file-color: #808080;
          --folder-color: #ededed;
          --shadow-default: rgba(255, 255, 255, 0.1) 0px 0px 0px 1px, rgba(0, 0, 0, 0.2) 0px 2px 2px 0px;
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          "Geist",
          system-ui,
          -apple-system,
          Arial,
          sans-serif;
      }

      body {
        background: var(--bg-color);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 96px 24px; /* Gallery emptiness */
      }

      .container {
        width: 100%;
        max-width: 900px;
        background: var(--card-bg);
        border: none;
        border-radius: 8px; /* rounded-md */
        box-shadow: var(--shadow-default); /* shadow-as-border */
        overflow: hidden;
        animation: fadeIn 0.3s ease-out;
      }

      header {
        padding: 24px;
        border-bottom: 1px solid var(--card-border);
        background: transparent;
      }

      h1 {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.96px; /* Compression as Identity */
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--text-main);
      }

      .path {
        margin-top: 8px;
        color: var(--text-muted);
        font-size: 14px;
        font-weight: 500;
        font-family: "Geist Mono", ui-monospace, monospace; /* Mono for technical metadata */
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .list-header {
        display: flex;
        padding: 12px 24px;
        border-bottom: 1px solid var(--card-border);
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 500;
        background: transparent;
      }

      .col-name {
        flex: 2;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .col-date {
        flex: 1;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        font-size: 14px;
      }
      .col-size {
        flex: 0.5;
        text-align: right;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        font-size: 14px;
      }

      .list-row {
        display: flex;
        padding: 16px 24px;
        border-bottom: 1px solid var(--card-border);
        text-decoration: none;
        color: var(--text-main);
        align-items: center;
        transition: background 0.1s ease;
        user-select: none;
        font-size: 14px;
      }

      .folder-toggle {
        cursor: pointer;
      }

      .list-row:hover {
        background: var(--hover-bg);
      }

      .list-row .col-name span {
        font-weight: 500;
        color: var(--text-main);
        transition: color 0.1s ease;
      }

      /* Hover states for monochrome aesthetics */
      .folder-toggle:hover .col-name span,
      a.list-row:hover .col-name span {
        color: var(--accent);
      }

      a.list-row:hover .col-name .icon.link {
        color: var(--link-color);
      }

      .icon {
        width: 20px;
        height: 20px;
        color: var(--file-color);
        flex-shrink: 0;
      }
      .icon.folder {
        color: var(--folder-color);
      }
      .icon.link {
        color: var(--text-muted);
        transition: color 0.1s ease;
      }

      .caret {
        width: 14px;
        height: 14px;
        color: var(--text-muted);
        transition: transform 0.2s ease;
        margin-right: -4px;
      }

      /* Collapsible Logic */
      .folder-content {
        display: none;
        flex-direction: column;
        background: transparent;
        border-bottom: 1px solid var(--card-border);
      }

      .folder-group.open .folder-content {
        display: flex;
        animation: slideDown 0.2s ease-out;
      }

      .folder-group.open .caret {
        transform: rotate(90deg);
      }

      .folder-group.open > .folder-toggle {
        border-bottom: 1px solid var(--card-border);
        background: var(--hover-bg);
      }

      .folder-group:last-child .folder-content {
        border-bottom: none;
      }

      .folder-group:last-child .folder-toggle {
        border-bottom: none;
      }

      .folder-group.open:last-child .folder-toggle {
        border-bottom: 1px solid var(--card-border);
      }

      /* Sub-item indentation */
      .sub-item {
        padding-left: 48px;
        border-bottom: 1px solid var(--card-border);
      }
      .sub-item:last-child {
        border-bottom: none;
      }
      .sub-item .caret {
        visibility: hidden; /* Keep alignment but hide caret for files */
        width: 14px;
      }

      footer {
        margin-top: 32px;
        text-align: center;
        color: var(--text-muted);
        font-size: 12px;
        font-family: "Geist Mono", ui-monospace, monospace;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-2px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 640px) {
        .col-date {
          display: none;
        }
        body {
          padding: 32px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            style="color: var(--text-main)">
            <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
          </svg>
          OurLabs
        </h1>
        <div class="path">Index of /</div>
      </header>

      <div class="list-header">
        <div class="col-name">Name</div>
        <div class="col-date">Last modified</div>
        <div class="col-size">Size</div>
      </div>

      <div class="file-list" id="file-list-container">
        <!-- Rendered dynamically by JavaScript -->
      </div>
    </div>

    <footer></footer>

    <script>
      // 1. Definisikan Data Struktur (Edit di sini untuk tambah file/folder)
      const directoryData = [
        {
          name: "Pemrograman Web XI",
          date: "23-Jul-2026 10:00",
          items: [
            {
              name: "1. Dasar pemrograman php",
              type: "link",
              url: "tutorial_page/dasar-php/index.html",
              date: "-",
            },
          ],
        },
        {
          name: "Pemrograman Web XII",
          date: "23-Jul-2026 10:01",
          items: [
            {
              name: "1. Latihan crud data film",
              type: "link",
              url: "tutorial_page/lat_crud_data-film/index.html",
              date: "-",
            },
            {
              name: "2. Latihan ukk kredit mobil",
              type: "link",
              url: "tutorial_page/lat_ukk_kredit-mobil/index.html",
              date: "-",
            },
          ],
        },
        {
          name: "Informatika XII",
          date: "23-Jul-2026 10:02",
          items: [
            {
              name: "1. Materi analisis data",
              type: "link",
              url: "https://www.canva.com/design/DAGtMVgjQ-E/laW_lV-odsa0x1EgoLAkbA/view?utm_content=DAGtMVgjQ-E&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=hc8909bf66c#20",
              date: "-",
            },
            {
              name: "2. Tutorial data cleaning dengan Microsoft Excel",
              type: "link",
              url: "tutorial_page/data-cleaning-excel/index.html",
              date: "-",
            },
            {
              name: "3. Tutorial data cleaning dengan Python",
              type: "link",
              url: "tutorial_page/data-cleaning-python/index.html",
              date: "-",
            },
            {
              name: "4. Tutorial data cleaning NLP",
              type: "link",
              url: "tutorial_page/data-cleaning_nlp_spam/index.html",
              date: "-",
            },
          ],
        },
      ];

      // 2. Fungsi untuk me-render HTML ke layar
      function renderDirectory(data, containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;

        let html = "";

        data.forEach((folder) => {
          html += `
            <div class="folder-group">
              <div class="list-row folder-toggle" onclick="toggleFolder(this)">
                <div class="col-name">
                  <svg class="caret" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18l6-6-6-6" />
                  </svg>
                  <svg class="icon folder" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 5h-9.586L8.707 2.293A1 1 0 0 0 8 2H4a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"></path>
                  </svg>
                  <span>${folder.name}</span>
                </div>
                <div class="col-date">${folder.date}</div>
                <div class="col-size">-</div>
              </div>
              <div class="folder-content">
          `;

          if (folder.items && folder.items.length > 0) {
            folder.items.forEach((item) => {
              if (item.type === "link") {
                html += `
                  <a href="${item.url}" target="_blank" class="list-row sub-item">
                    <div class="col-name">
                      <svg class="caret" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none" /></svg>
                      <svg class="icon link" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                      </svg>
                      <span>${item.name}</span>
                    </div>
                    <div class="col-date">${item.date}</div>
                    <div class="col-size">Link</div>
                  </a>
                `;
              }
            });
          }

          html += `
              </div>
            </div>
          `;
        });

        container.innerHTML = html;
      }

      // 3. Render saat DOM siap
      document.addEventListener("DOMContentLoaded", () => {
        renderDirectory(directoryData, "file-list-container");
      });

      // 4. Logika Buka/Tutup Folder
      function toggleFolder(element) {
        const group = element.closest(".folder-group");
        group.classList.toggle("open");
      }
    </script>
  </body>
</html>
